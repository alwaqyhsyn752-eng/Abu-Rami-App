name: Build Main APK

on:
  push:
    branches: [main]
    paths:
      - 'android_main/**'
      - '.github/workflows/build-main-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > $ANDROID_HOME/licenses/intel-android-extra-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/google-gdk-license
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > $ANDROID_HOME/licenses/android-googletv-license
          echo "601085b94cd77f0b54ff86406957099ebe79c4d6" > $ANDROID_HOME/licenses/android-sdk-arm-dbt-license
          echo "e9acab5b5fbb560a72cfaecce8946896ff6aab9d" > $ANDROID_HOME/licenses/mips-android-sysimage-license
          echo "SDK licenses accepted"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android_main/release.keystore
          ls -la android_main/release.keystore

      - name: Build Release APK
        working-directory: android_main
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare output
        run: |
          mkdir -p output
          cp android_main/app/build/outputs/apk/release/app-release.apk \
             "output/HusseinGhallab-v${{ github.run_number }}.apk"
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HusseinGhallab-APK
          path: output/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hussein-apk-v${{ github.run_number }}
          name: "حسين غلاب — APK v${{ github.run_number }}"
          body: |
            ## تطبيق حسين غلاب AI
            المطور: حسين غلاب
            الموقع: https://abu-rami-app-s90e.onrender.com
          files: output/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
