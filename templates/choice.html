<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0520">
<title>اختر الواجهة</title>
<style>
:root{--bg:#0a0520;--purple:#a855f7;--cyan:#22d3ee;--gold:#fbbf24;--text:#f0f4ff;--muted:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;position:relative}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 20% 0%,rgba(168,85,247,0.25),transparent 55%),
    radial-gradient(ellipse at 80% 100%,rgba(34,211,238,0.22),transparent 55%),
    radial-gradient(circle at 50% 50%,rgba(251,191,36,0.08),transparent 70%);
  animation:hue 10s infinite alternate;
}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(30deg)}}

.brand-top{
  position:relative;z-index:2;text-align:center;margin-bottom:36px;
}
.brand-top h1{
  font-size:clamp(1.6rem,6vw,2.4rem);font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#a855f7,#22d3ee,#fbbf24,#a855f7);
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 4s infinite linear;
  margin-bottom:10px;
}
@keyframes shine{from{background-position:0% 50%}to{background-position:300% 50%}}
.brand-top p{color:var(--muted);font-size:.95rem;letter-spacing:1px}

.cards{
  display:flex;flex-direction:column;gap:18px;
  width:100%;max-width:440px;position:relative;z-index:2;
}
.card{
  padding:26px 24px;border-radius:22px;cursor:pointer;
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(168,85,247,0.25);
  backdrop-filter:blur(16px);
  display:flex;align-items:center;gap:18px;
  transition:.35s;
  text-decoration:none;color:var(--text);
  position:relative;overflow:hidden;
}
.card:hover,.card:active{transform:translateY(-4px);box-shadow:0 12px 40px rgba(168,85,247,0.35)}
.card::before{
  content:"";position:absolute;inset:-2px;border-radius:22px;
  padding:2px;background:linear-gradient(135deg,#a855f7,#22d3ee,#fbbf24);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:.35s;
}
.card:hover::before{opacity:1}

.card-olq{
  background:linear-gradient(135deg,rgba(168,85,247,0.12),rgba(34,211,238,0.08));
  border-color:rgba(168,85,247,0.45);
}
.card-olq:hover{box-shadow:0 12px 50px rgba(168,85,247,0.55)}

.card-rami{
  background:linear-gradient(135deg,rgba(34,211,238,0.1),rgba(6,182,212,0.06));
  border-color:rgba(34,211,238,0.4);
}
.card-rami:hover{box-shadow:0 12px 50px rgba(34,211,238,0.45)}

.icon{
  width:64px;height:64px;border-radius:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;font-weight:900;
}
.card-olq .icon{
  background:radial-gradient(circle at 30% 30%,#f0abfc,#a855f7,#7c3aed);
  box-shadow:0 0 25px rgba(168,85,247,0.6);
  color:#fff;
}
.card-rami .icon{
  background:radial-gradient(circle at 30% 30%,#67e8f9,#06b6d4,#0369a1);
  box-shadow:0 0 25px rgba(6,182,212,0.6);
  color:#fff;
}

.info{flex:1}
.info h2{font-size:1.35rem;font-weight:800;margin-bottom:6px;letter-spacing:1px}
.info p{font-size:.85rem;color:var(--muted);line-height:1.5}
.info .tags{
  display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;
}
.tag{
  font-size:.68rem;padding:3px 9px;border-radius:12px;
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  color:var(--muted);
}

.arrow{
  font-size:1.4rem;color:var(--purple);font-weight:bold;
  transition:.3s;
}
.card:hover .arrow{transform:translateX(-6px)}

.footer{
  margin-top:36px;text-align:center;color:var(--muted);
  font-size:.78rem;letter-spacing:1px;position:relative;z-index:2;
}
.footer span{color:var(--purple);font-weight:700}

@media (min-width:700px){
  .cards{max-width:520px}
}
</style>
</head>
<body>

<div class="brand-top">
  <h1>ABU RAMI SYSTEM</h1>
  <p>اختر واجهتك المفضلة للدخول</p>
</div>

<div class="cards">
  <a href="/olq" class="card card-olq">
    <div class="icon">◆</div>
    <div class="info">
      <h2>أبو عولق</h2>
      <p>الواجهة المستقبلية — 7 أوضاع تفكير متقدمة</p>
      <div class="tags">
        <span class="tag">تفكير عميق</span>
        <span class="tag">خبير</span>
        <span class="tag">بحث</span>
        <span class="tag">Termux</span>
        <span class="tag">Telegram</span>
      </div>
    </div>
    <div class="arrow">‹</div>
  </a>

  <a href="/abu-rami" class="card card-rami">
    <div class="icon">✦</div>
    <div class="info">
      <h2>أبو رامي AI</h2>
      <p>الواجهة الكلاسيكية — محادثة ذكية + توليد تطبيقات</p>
      <div class="tags">
        <span class="tag">محادثة</span>
        <span class="tag">أصوات</span>
        <span class="tag">APK</span>
        <span class="tag">صور</span>
      </div>
    </div>
    <div class="arrow">‹</div>
  </a>
</div>

<div class="footer">
  <span>لسنا الوحيدين، لكن الأفضل بذكاء</span>
</div>

</body>
</html>
